function render(){if(page!=='index'&&page!=='late_ftd'&&$('month').value!=='all'&&$('month').value>DATA.meta.as_of.slice(0,7)){tabs([]);$('content').innerHTML=note('За выбранный месяц данные ещё не поступили. Последний день факта: '+DATA.meta.as_of,true);return;}$('content').innerHTML=({index:home,pulsation:pulse,retention,late_ftd:late,reactivation}[page]||home)();if($('curve'))updateCurve();if($('funnel'))updateFunnel();}
$('month').onchange=render;$('geo').onchange=render;
$('download').onclick=()=>{let ts=[...document.querySelectorAll('#content table')];if(!ts.length)return;const text=ts.map(t=>[...t.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/"/g,'""')+'"').join(';')).join('\r\n')).join('\r\n\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download=page+'.csv';a.click();URL.revokeObjectURL(a.href);};
render();
</script></body></html>
