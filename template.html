<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retention · отчёты отдела</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#18243a;font:14px Segoe UI,Arial,sans-serif}.wrap{max-width:1440px;margin:auto;padding:26px}header{background:linear-gradient(110deg,#14233e,#284875);color:white;border-radius:18px;padding:27px;margin-top:16px}h1{margin:0 0 8px}h2{font-size:19px;margin:0 0 15px}.muted{color:#6b7d96;line-height:1.6}.filters{display:flex;flex-wrap:wrap;gap:14px;padding:18px;background:white;border-radius:14px;margin:18px 0}label{display:grid;gap:6px;font-size:12px;color:#546784}select,button{font:inherit;padding:10px;border:1px solid #dce3ee;border-radius:8px;background:white}button{cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:#e3e9f4;border:0}.tabs .on{background:#4966d5;color:white}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.panel,.kpi{background:white;padding:20px;border:1px solid #e3eaf3;border-radius:14px}.kpi b{display:block;font-size:28px;margin:8px 0}.kpi small{color:#6b7d96}.layout{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:16px 0}.wide{grid-column:1/-1}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:11px;text-align:right;border-bottom:1px solid #e5eaf3}td:first-child,th:first-child{text-align:left}th{background:#edf2fa}td small{display:block;color:#546784;font-size:11px}.note{padding:14px;background:#fff5dc;border:1px solid #f3dda6;border-radius:10px;margin:15px 0;line-height:1.6}a{color:#425bd0}.barrow{display:grid;grid-template-columns:65px 1fr 135px;gap:10px;align-items:center;margin:15px 0}.track{height:24px;background:#edf2f9;border-radius:6px}.bar{height:100%;background:#20a785;border-radius:6px}@media(max-width:850px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
</style></head><body><div class="wrap"><a href="index.html">← Главная страница отчётов</a><header><h1>Retention и жизненный цикл</h1><div>Возврат после первого депозита · депозитная воронка · экономика когорт</div><p id="meta"></p></header><div class="filters"><label>GEO<select id="geo"></select></label><label>Когорта регистрации<select id="reg"></select></label><label>Месяц FTD<select id="ftd_month"></select></label><label>Подтверждённый контакт<select id="contact"></select></label><label>Партнёрский ID<select id="partner"></select></label><button id="reset">Все периоды и GEO</button></div><div id="status"></div><nav class="tabs" id="tabs"></nav><main id="content"></main></div><script>
const data=__PAYLOAD__,rows=data.rows,$=id=>document.getElementById(id),DAYS=[3,7,14,30],names=['Retention','Возврат по интервалам','Депозитная воронка','Экономика D0–D30','О данных'];let active=0;
const fmt=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2}),pct=(n,d)=>d?fmt(100*n/d)+'%':'—',money=x=>Number(x).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unique=x=>[...new Set(x)].sort(),geoOrder=['TR','AR','CO','IN'],geos=[...geoOrder.filter(g=>rows.some(r=>r.geo===g)),...unique(rows.map(r=>r.geo)).filter(g=>!geoOrder.includes(g))];
function options(id,values,label,display=x=>x){$(id).innerHTML='<option value="all">'+label+'</option>'+values.map(x=>`<option value="${esc(x)}">${esc(display(x))}</option>`).join('');$(id).value='all';$(id).onchange=render}
options('geo',geos,'Все GEO');$('geo').innerHTML='<option value="all">Все GEO</option>'+['Основные GEO','Другие GEO'].map((label,i)=>'<optgroup label="'+label+'">'+geos.filter(g=>geoOrder.includes(g)===(i===0)).map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('')+'</optgroup>').join('');$('geo').value='all';options('reg',unique(rows.map(r=>r.reg)),'Все регистрации');options('ftd_month',unique(rows.map(r=>r.ftd_month).filter(Boolean)),'Все, включая без FTD');options('contact',[0,1],'Все',x=>x?'Есть подтверждённый контакт':'Нет подтверждённого контакта');options('partner',[0,1],'Все',x=>x?'partner_id указан':'partner_id не указан');
const query=new URLSearchParams(location.search);for(let key of ['geo','ftd_month']){const v=query.get(key);if(v&&[...$(key).options].some(o=>o.value===v))$(key).value=v}
$('reset').onclick=()=>{for(const key of ['geo','reg','ftd_month','contact','partner'])$(key).value='all';render()};
$('meta').textContent=`${fmt(data.meta.rows)} игроков · регистрации ${data.meta.first_registration} — ${data.meta.last_registration} · выгрузка ${data.meta.snapshot_date}`;
function selected(){return rows.filter(r=>['geo','reg','ftd_month','contact','partner'].every(k=>$(k).value==='all'||String(r[k])===$(k).value))}
function sum(a){let v={};for(const r of a)for(const [key,n]of Object.entries(r.v))v[key]=(v[key]||0)+n;return new Proxy(v,{get:(t,k)=>t[k]||0})}
function groups(a,key){let keys=unique(a.map(r=>r[key]).filter(Boolean));if(key==='geo')keys=geos.filter(g=>keys.includes(g));return keys.map(k=>[k,sum(a.filter(r=>r[key]===k))])}
function geoSplit(a,fn){let main=a.filter(r=>geoOrder.includes(r.geo)),other=a.filter(r=>!geoOrder.includes(r.geo));return (main.length?fn(main):'')+(other.length?`<details class="panel wide"><summary>Другие GEO · ${fmt(sum(other).ftd)} FTD — показать</summary>${fn(other)}</details>`:'')}

function panel(title,body,wide=false){return `<section class="panel ${wide?'wide':''}"><h2>${title}</h2>${body}</section>`}
function cards(v){return '<div class="kpis">'+DAYS.map(d=>`<div class="kpi">D${d}+ retention<b>${pct(v['r'+d],v['m'+d])}</b><small>${fmt(v['r'+d])} / ${fmt(v['m'+d])} зрелых FTD</small></div>`).join('')+'</div>'}
function heat(a,key,title,window=false,split=true){if(key==='geo'&&split)return geoSplit(a,x=>heat(x,key,title,window,false));let g=groups(a,key),win=['active_d1_3','active_d4_7','active_d8_14','active_d15_30'];return panel(title,`<div class="scroll"><table><thead><tr><th>${key==='geo'?'GEO':key==='reg'?'Месяц регистрации':'Месяц FTD'}</th><th>FTD</th>${DAYS.map((d,i)=>`<th>${window?['D1–3','D4–7','D8–14','D15–30'][i]:'D'+d+'+'}</th>`).join('')}</tr></thead><tbody>${g.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmt(v.ftd)}</td>${DAYS.map((d,i)=>{let den=v['m'+d],n=v[window?win[i]:'r'+d];return `<td style="background:rgba(77,101,213,${den?.08+.55*n/den:0})">${pct(n,den)}<small>${fmt(n)} / ${fmt(den)}</small></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`,true)}
function curve(a,recent=false){const pre=recent?'curve90':'curve',colors=['#2563eb','#ef8c25','#8b5cf6','#16a89a','#69849f'];let series=groups(a,'geo').filter(([g,v])=>v[pre+'_den']>0);let svg='<svg viewBox="0 0 1050 360" role="img" aria-label="Rolling retention D0–D30 по GEO" style="width:100%;min-width:650px">';for(let y=0;y<=100;y+=25){let py=290-2.5*y;svg+=`<line x1="55" y1="${py}" x2="1015" y2="${py}" stroke="#dae3ef"/><text x="8" y="${py+5}" fill="#60728a">${y}%</text>`}for(let d=0;d<=30;d+=3)svg+=`<text x="${55+32*d}" y="318" text-anchor="middle" fill="#60728a">D${d}</text>`;series.forEach(([g,v],i)=>{let color=colors[i%colors.length],den=v[pre+'_den'];svg+=`<polyline fill="none" stroke="${color}" stroke-width="3" points="${Array.from({length:31},(_,d)=>`${55+32*d},${290-250*v[pre+'_'+d]/den}`).join(' ')}"/>`;for(let d=0;d<=30;d++)svg+=`<circle cx="${55+32*d}" cy="${290-250*v[pre+'_'+d]/den}" r="3" fill="${color}"><title>${g} D${d}+: ${pct(v[pre+'_'+d],den)} · ${fmt(v[pre+'_'+d])} / ${fmt(den)}</title></circle>`});svg+='</svg>';return panel(recent?'Rolling retention · FTD за последние 90 дней':'Rolling retention · выбранные когорты FTD',`<div class="scroll">${svg}</div><p>${series.map(([g,v],i)=>`<span style="color:${colors[i%colors.length]};margin-right:20px">● ${g} · ${fmt(v[pre+'_den'])} зрелых FTD</span>`).join(' ')||'Нет зрелых D30 игроков'}</p><p class="muted">Единая база: только зрелые D30 FTD. D0 = 100%; Dn+ — активность на день n или позднее, включая дни после D30. Основано на max_active_day_after_ftd. ${recent?'Последние 90 календарных дней до даты выгрузки '+data.meta.snapshot_date+'.':''} Это rolling retention от FTD; на скрине используется другая точка отсчёта — первая денежная ставка.</p>`,true)}
function retention(a,v){const bars=x=>panel('D3+ по GEO',geos.filter(g=>x.some(r=>r.geo===g)).map(g=>{let z=sum(x.filter(r=>r.geo===g));return `<div class="barrow"><strong>${esc(g)}</strong><div class="track"><div class="bar" style="width:${z.m3?100*z.r3/z.m3:0}%"></div></div><span>${pct(z.r3,z.m3)} <small>(${fmt(z.m3)})</small></span></div>`}).join('')+'<p class="muted">В скобках — зрелые FTD.</p>',true);return cards(v)+`<div class="layout">${geoSplit(a,x=>curve(x,true)+curve(x)+bars(x))}${heat(a,'ftd_month','Когорта FTD: rolling retention')}${heat(a,'reg','Когорта регистрации: retention после FTD')}${heat(a,'geo','Сравнение GEO')}</div>`}
function funnelGeo(a){return geoSplit(a,x=>panel('Депозитная воронка по GEO',`<div class="scroll"><table><tr><th>GEO</th><th>FTD</th>${[2,3,5,8].map(d=>`<th>${d}+ / FTD</th>`).join('')}${['1→2','2→3','3→5','5→8'].map(d=>`<th>${d}</th>`).join('')}</tr>${groups(x,'geo').map(([g,z])=>{let n=[z.ftd,z.dep2,z.dep3,z.dep5,z.dep8];return `<tr><td>${esc(g)}</td><td>${fmt(z.ftd)}</td>${[2,3,5,8].map(d=>`<td>${pct(z['dep'+d],z.ftd)}<small>${fmt(z['dep'+d])} / ${fmt(z.ftd)}</small></td>`).join('')}${n.slice(1).map((v,i)=>`<td>${pct(v,n[i])}<small>${fmt(v)} / ${fmt(n[i])}</small></td>`).join('')}</tr>`}).join('')}</table></div>`,true))}
function funnel(a,v){let stages=[['FTD',v.ftd],...[2,3,5,8].map(d=>[d+'+ депозитов',v['dep'+d]])];let visual=stages.map(([label,n],i)=>`<div style="width:${v.ftd?Math.max(10,100*n/v.ftd):100}%;margin:8px auto;padding:14px;background:${['#355bc6','#4d6fd4','#6382df','#7b97e6','#94aeef'][i]};color:white;border-radius:7px;text-align:center"><b>${label}: ${fmt(n)}</b> · ${pct(n,v.ftd)} от FTD</div>`).join('');let transitions=stages.slice(1).map(([label,n],i)=>`<tr><td>${stages[i][0]} → ${label}</td><td>${fmt(n)} / ${fmt(stages[i][1])}</td><td>${pct(n,stages[i][1])}</td><td>${fmt(stages[i][1]-n)}</td></tr>`).join('');let extra=panel('Визуальная воронка · от FTD',visual+'<p class="muted">Минимальная ширина ступени 10% сохраняет читаемость; точная доля указана числом. Все ступени — накопленное достижение порога депозитов. Проценты от единой базы FTD.</p>',true)+panel('Перетоки между ступенями',`<div class="scroll"><table><tr><th>Переход</th><th>Достигли / база</th><th>Конверсия перехода</th><th>Не достигли следующего порога</th></tr>${transitions}</table></div><p class="muted">2→3: игроки с 3+ депозитами / игроки с 2+. 3→5 и 5→8 — переходы между порогами, включая промежуточные депозиты. Длина наблюдения различается.</p>`,true);let metrics=[['Регистрация',v.users,v.users],['FTD',v.ftd,v.users],...[2,3,5,8].map(d=>[d+'+ депозитов',v['dep'+d],v.ftd])];let table=metrics.map(([n,num,den])=>`<tr><td>${n}</td><td>${fmt(num)}</td><td>${pct(num,den)}</td><td>${fmt(den)} ${n==='FTD'||n==='Регистрация'?'регистраций':'FTD'}</td></tr>`).join('');let regWin=[1,3,7,14,30].map(d=>`<tr><td>FTD за D${d}</td><td>${fmt(v['regf'+d])}</td><td>${fmt(v['regm'+d])}</td><td>${pct(v['regf'+d],v['regm'+d])}</td></tr>`).join('');return `<div class="layout">${extra}${funnelGeo(a)}${panel('Депозитная воронка',`<div class="scroll"><table><tr><th>Этап</th><th>Игроки</th><th>Доля</th><th>Знаменатель</th></tr>${table}</table></div><p class="muted">2/3/5/8+ считаются от всех FTD в текущей выборке. Период наблюдения разный. Фильтр месяца FTD исключает игроков без депозита: для Reg → FTD выберите «Все, включая без FTD».</p>`,true)}${panel('Скорость Reg → FTD',`<div class="scroll"><table><tr><th>Окно</th><th>FTD в окне</th><th>Зрелые регистрации</th><th>Конверсия</th></tr>${regWin}</table></div>`,true)}${panel('Подтверждённый контакт',`<p style="font-size:28px">${pct(v.verified,v.users)}</p><p>${fmt(v.verified)} / ${fmt(v.users)} игроков в выборке.</p>`,true)}</div>`}
function economics(a,v){let headers='<tr><th>Когорта FTD</th><th>Зрелые D30</th><th>GGR D0–D30</th><th>Бонусы</th><th>NGR</th><th>NGR / зрелый FTD</th></tr>';return `<div class="layout">${panel('Экономика за одинаковое окно',`<p class="muted">Включены только matured_d30 = 1. NGR = GGR − стоимость переведённых бонусов. Все суммы в USD; отрицательный NGR допустим.</p><div class="kpis"><div class="kpi">Зрелых FTD<b>${fmt(v.m30)}</b></div><div class="kpi">GGR<b>${v.m30?money(v.ggr_d0_30):'—'}</b></div><div class="kpi">Бонусы<b>${v.m30?money(v.bonus_d0_30):'—'}</b></div><div class="kpi">NGR<b>${v.m30?money(v.ngr_d0_30):'—'}</b></div></div>`,true)}${panel('D0–D30 по месяцу FTD',`<div class="scroll"><table>${headers}${groups(a,'ftd_month').map(([k,z])=>`<tr><td>${k}</td><td>${fmt(z.m30)}</td><td>${z.m30?money(z.ggr_d0_30):'—'}</td><td>${z.m30?money(z.bonus_d0_30):'—'}</td><td>${z.m30?money(z.ngr_d0_30):'—'}</td><td>${z.m30?money(z.ngr_d0_30/z.m30):'—'}</td></tr>`).join('')}</table></div>`,true)}</div>`}
function render(){let a=selected(),v=sum(a);$('status').innerHTML=`<div class="note">В выборке ${fmt(v.users)} регистраций, ${fmt(v.ftd)} FTD. D3+ = активность на D3 или позднее, а не строго на третий день. У каждого окна свой зрелый знаменатель. Молодые FTD исключены из числителя и знаменателя.</div>`;$('tabs').innerHTML=names.map((n,i)=>`<button data-tab="${i}" class="${active===i?'on':''}">${n}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{active=+e.dataset.tab;render()});let html=active===0?retention(a,v):active===1?`<div class="layout">${panel('Возврат по интервалам',`<p>Доля игроков с успешным депозитом или real-money bet в указанном интервале после FTD. Для D1–3 используется зрелость D3, для D4–7 — D7, для D8–14 — D14, для D15–30 — D30. Один игрок может вернуться в нескольких интервалах.</p>`,true)}${heat(a,'ftd_month','Возврат по когорте FTD',true)}${heat(a,'geo','Возврат по GEO',true)}</div>`:active===2?funnel(a,v):active===3?economics(a,v):`<div class="layout">${panel('Методика',`<p>Источник: user_lifecycle. Одна строка исходного CSV — зарегистрированный игрок; в отчёте только агрегаты. Регистрации охватывают ${data.meta.first_registration} — ${data.meta.last_registration}; игроки с регистрацией вне этого периода в retention не представлены.</p><p>FTD — первый успешный депозит: Captured, deposit_flag=true, correction_flag=false. Retention начинается с FTD. Активность: real-money bet или успешный депозит.</p><p>D3+/D7+/D14+/D30+ — rolling retention: активность в соответствующий день или позднее. Это открытое окно, поэтому у старых когорт больше времени на возврат даже после исключения незрелых FTD. Для интервалов используйте соседнюю вкладку.</p><p>GGR: real-money casino transactions. Бонусы: переведённые на основной баланс. NGR = GGR − бонусы. Экономика ограничена зрелыми D0–D30.</p><p>На главной план D3+ относится к месяцу FTD и зрелым игрокам выбранного GEO. Наличие partner_id не определяет канал трафика. Дата выгрузки ${data.meta.snapshot_date} — дата получения файла; точный cutoff активности внутри дня в файле не указан. Исключение тестовых игроков зависит от SQL источника.</p>`,true)}</div>`;$('content').innerHTML=html}render();
</script></body></html>
